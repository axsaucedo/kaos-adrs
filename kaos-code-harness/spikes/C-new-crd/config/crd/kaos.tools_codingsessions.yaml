---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: codingsessions.kaos.tools
spec:
  group: kaos.tools
  names:
    kind: CodingSession
    listKind: CodingSessionList
    plural: codingsessions
    shortNames:
    - cs
    singular: codingsession
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.harnessRef
      name: Harness
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.branch
      name: Branch
      type: string
    - jsonPath: .status.pullRequestURL
      name: PR
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CodingSession is one coding run against one workspace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CodingSessionSpec is one run against one workspace.
            properties:
              budgets:
                description: SessionBudgets bounds one run. Mirrors the Agent CRD's
                  TaskConfig.
                properties:
                  maxIterations:
                    default: 20
                    format: int32
                    type: integer
                  maxRuntimeSeconds:
                    default: 3600
                    format: int32
                    type: integer
                  maxToolCalls:
                    default: 500
                    format: int32
                    type: integer
                type: object
              harnessRef:
                type: string
              mode:
                default: autonomous
                enum:
                - autonomous
                - interactive
                type: string
              prompt:
                type: string
              repo:
                description: RepoSpec describes how the workspace is populated.
                properties:
                  branch:
                    default: main
                    type: string
                  credentialsRef:
                    description: CredentialsRef supplies a token for clone and push.
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  depth:
                    default: 1
                    format: int32
                    minimum: 0
                    type: integer
                  url:
                    type: string
                required:
                - url
                type: object
              ttlSecondsAfterFinished:
                default: 86400
                description: |-
                  TTLSecondsAfterFinished cleans up terminal sessions. This is the capability
                  spike A could not reach: a Deployment never finishes.
                format: int32
                type: integer
            required:
            - harnessRef
            - prompt
            type: object
          status:
            description: |-
              CodingSessionStatus is the object spike A identified as the biggest gap —
              AgentStatus carries no run, branch, or PR information at all.
            properties:
              branch:
                description: Branch produced by the session; the durable output.
                type: string
              commitSHA:
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              endTime:
                format: date-time
                type: string
              filesChanged:
                format: int32
                type: integer
              jobName:
                type: string
              message:
                type: string
              phase:
                enum:
                - Pending
                - Working
                - Completed
                - Failed
                - Canceled
                type: string
              podName:
                type: string
              pullRequestURL:
                type: string
              startTime:
                format: date-time
                type: string
              transcriptPVC:
                description: |-
                  TranscriptPVC holds the harness's own config root so its native --resume
                  works without KAOS parsing the transcript.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
